<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeremy</title>
  <link rel="stylesheet" href="cards.css">
</head>
<body>
  <div class="container">
    <div class="main-card">
      <div class="card-top">
    <img src="./cop1.png" alt="man" class="image">
        <p> Report for</p>
        <p style="color: white; font-size: 40px; ">Jeremy <br> Robson</p>
      </div>
      <p class="name">Daily</p>
      <p style="color: white;" class="name">Weekly</p>
      <p class="name">Monthly</p>
    </div>
    <div class="content">
      <div class="work">
        <div class="card-bottom">
          <h4>Work</h4>
          <p class="time">32hrs</p>
          <p>Last week - 36hrs</p>
        </div>
      </div>
      <div class="play">
        <div class="card-bottom">
           <h4>Play</h4>
           <p class="time">10hrs</p>
           <p>Last week - 8hrs</p>
        </div>
      </div>
      <div class="study">
        <div class="card-bottom">
          <h4>Study</h4>
          <p class="time">4hrs</p>
          <p>Last week - 7hrs</p>
        </div>
      </div>
      <div class="exercise">
        <div class="card-bottom">
          <h4>Exercise</h4>
          <p class="time">4hrs</p>
          <p>Last week - 5hrs</p>
        </div>
      </div>
      <div class="social">
        <div class="card-bottom">
          <h4>Social</h4>
          <p class="time">5hrs</p>
          <p>Last week - 10hrs</p>
        </div>
      </div>
      <div class="selfcare">
        <div class="card-bottom">
          <h4>Selfcare</h4>
          <p class="time">2hrs</p>
          <p>Last week - 2hrs</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
