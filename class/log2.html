<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://kit.fontawesome.com/a9325a5910.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./log2.css" />
  </head>
  <body>
    <div class="page">
      <div class="form">
        <h4>Login to continue</h4>
        <!-- the first input areas -->
        <div class="d-grid gap-2  text-white">
          <button class="btn btn-primary button1" type="button"><i class="fa-brands fa-facebook-f"></i> Continue with Facebook</button>
        </div>
        <div class="d-grid gap-2  mt-3">
          <button class="btn button2" type="button"><i class="fa-brands fa-google"></i> Continue with Google</button>
        </div>

        <h5>or</h5>
        <!-- the second input areas -->
        <div class="mb-4 areas">
          <input
            type="email"
            class="form-control"
            id-="floatingInput"
            placeholder="Email"
          />
        </div>
        <div class="mb-4 areas">
          <input
            type="password"
            class="form-control"
            id-="floatingPassword"
            placeholder="Password"
          />
        </div>
        <!-- the button -->
        <div class="d-grid gap-2 button3">
          <button class="btn" type="button">SIGN IN</button>
        </div>
<div class="par">
        <p> Don't have an account?</p>
        <p><a href="#">sign up here</a></p>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
